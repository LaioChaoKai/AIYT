<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 小說名稱 AI 搜尋器 | 免登入一鍵辨識</title>
    <meta name="description" content="輸入 YouTube 小說解說影片網址，AI 自動為您精準辨識原始小說名稱、作者與主角資訊！">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-badge {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 999px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .input-group {
                flex-direction: row;
            }
        }

        input[type="url"], input[type="text"] {
            flex: 1;
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="url"]:focus, input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        button.btn-search {
            padding: 1rem 1.75rem;
            border-radius: 0.75rem;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button.btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        button.btn-search:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .quick-samples {
            margin-top: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .sample-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #cbd5e1;
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sample-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            color: white;
        }

        #result-box {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .result-content {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 1.05rem;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.5);
            padding: 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .spinner {
            display: inline-block;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span class="logo-badge">🤖 AI 自動辨識</span>
            <h1>YouTube 小說名稱 AI 搜尋器</h1>
            <p class="subtitle">輸入小說/動漫解說影片網址，AI 自動為您揭曉原始小說名稱、作者與主角！</p>
        </header>

        <main class="card">
            <form id="search-form" onsubmit="handleSearch(event)">
                <div class="input-group">
                    <input 
                        type="url" 
                        id="youtube-url" 
                        placeholder="請貼上 YouTube 影片網址 (例如 https://youtu.be/...)" 
                        required
                    >
                    <button type="submit" id="submit-btn" class="btn-search">
                        <span>🔍 立即辨識</span>
                    </button>
                </div>
            </form>

            <div class="quick-samples">
                <span>快速示範影片：</span>
                <button type="button" class="sample-btn" onclick="fillSample('https://youtu.be/6S_C1tA_Ljs')">高武暴擊小說影片</button>
            </div>

            <div id="result-box">
                <div id="result-text" class="result-content"></div>
            </div>
        </main>

        <footer>
            <p>© 2026 YouTube Novel Finder | Powered by Google Gemini AI</p>
        </footer>
    </div>

    <script>
        function fillSample(url) {
            document.getElementById('youtube-url').value = url;
        }

        async function handleSearch(e) {
            e.preventDefault();
            const urlInput = document.getElementById('youtube-url');
            const submitBtn = document.getElementById('submit-btn');
            const resultBox = document.getElementById('result-box');
            const resultText = document.getElementById('result-text');

            const url = urlInput.value.trim();
            if (!url) return;

            // UI 狀態切換
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner"></span> <span>AI 分析中...</span>`;
            resultBox.style.display = 'block';
            resultText.innerHTML = '🔍 正在讀取影片標題、說明欄與字幕，請稍候...';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();

                if (response.ok && data.result) {
                    resultText.innerHTML = data.result;
                } else {
                    resultText.innerHTML = '❌ ' + (data.error || '解析失敗，請稍後再試。');
                }
            } catch (err) {
                resultText.innerHTML = '⚠️ 網路連線錯誤，請確定伺服器正常運作中。';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>🔍 立即辨識</span>';
            }
        }
    </script>
</body>
</html>
